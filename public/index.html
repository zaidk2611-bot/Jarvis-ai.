<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Jarvis AI</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#0b1220;color:#edf2ff;font:16px system-ui, sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
    .app{width:min(720px,100%);background:#121d30;border:1px solid #263750;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0006}
    header{display:flex;align-items:center;gap:14px;margin-bottom:20px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9f5ff,#2689d8 48%,#12345f);box-shadow:0 0 24px #38bdf877}
    h1{font-size:25px;margin:0} .sub{color:#9fb0c9;font-size:13px;margin-top:3px}
    #chat{height:48vh;min-height:260px;overflow:auto;background:#0b1424;border-radius:15px;padding:14px;display:flex;flex-direction:column;gap:12px}
    .bubble{padding:11px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.45}.jarvis{background:#1b2c45;align-self:flex-start}.you{background:#155e75;align-self:flex-end}
    .controls{display:flex;gap:9px;margin-top:14px}input{min-width:0;flex:1;background:#0b1424;color:white;border:1px solid #344761;border-radius:12px;padding:14px;font-size:16px}
    button{border:0;border-radius:12px;padding:0 16px;background:#1685c5;color:white;font-weight:650;font-size:15px}button:disabled{opacity:.5}
    #mic{background:#27415f} .note{font-size:12px;color:#91a2bb;margin-top:12px}
    @media(max-width:480px){.app{padding:15px}.controls{flex-wrap:wrap}input{flex-basis:100%;}button{height:46px;flex:1}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="orb"></div><div><h1>JARVIS</h1><div class="sub">Your personal AI assistant</div></div></header>
    <section id="chat" aria-live="polite">
      <div class="bubble jarvis">Hello! I'm Jarvis. Type a message or use the microphone to talk to me.</div>
    </section>
    <form class="controls" id="form">
      <input id="message" placeholder="Ask Jarvis anything..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
      <button id="mic" type="button">🎙️ Talk</button>
    </form>
    <div class="note">Voice input works in supported browsers and may require microphone permission. Spoken replies use your phone's available voice.</div>
  </main>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const form = document.getElementById("form");
const send = document.getElementById("send");
function add(text, who) {
  const div = document.createElement("div");
  div.className = "bubble " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1;
  speechSynthesis.speak(utterance);
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add(message, "you");
  input.value = "";
  send.disabled = true;
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    const reply = data.reply || "I don't have a reply yet.";
    add(reply, "jarvis");
    speak(reply);
  } catch (error) {
    add("Sorry, I couldn't connect: " + error.message, "jarvis");
  } finally {
    send.disabled = false;
    input.focus();
  }
});
const micButton = document.getElementById("mic");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  micButton.addEventListener("click", () => recognition.start());
  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    form.requestSubmit();
  };
  recognition.onerror = () => add("Microphone input wasn't available. Check browser permission and try again.", "jarvis");
} else {
  micButton.disabled = true;
  micButton.textContent = "Voice unavailable";
}
</script>
</body>
</html>
